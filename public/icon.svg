<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e143c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0d19" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="starGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe664"/>
      <stop offset="100%" stop-color="#ffc81e"/>
    </radialGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGlow)"/>
  <!-- 5-pointed star -->
  <polygon
    points="256,72 299,186 422,186 325,254 361,370 256,302 151,370 187,254 90,186 213,186"
    fill="url(#starGrad)"
  />
  <!-- Play button overlay -->
  <polygon
    points="224,216 224,296 312,256"
    fill="#0d0d19"
    opacity="0.88"
  />
</svg>
